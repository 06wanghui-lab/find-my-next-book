[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "find-my-next-book-api"
version = "0.1.0"
description = "Grounded recommendation API for Chinese web novels"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langchain-core>=1.4,<2.0",
    "langchain-google-genai>=4.0,<5.0",
    "langchain-tavily>=0.2,<1.0",
    "langgraph>=0.4,<2.0",
    "opencc>=1.4,<2.0",
    "pydantic-settings>=2.8,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.11,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/find_my_next_book_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: invokes paid external Gemini and Tavily APIs (opt in with RUN_LIVE_TESTS=1)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

